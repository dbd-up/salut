<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GETUP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 100, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(150, 0, 255, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .title {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(
                90deg,
                #ff0080,
                #ff8c00,
                #ffee00,
                #00ff80,
                #00c8ff,
                #8000ff,
                #ff0080
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rgbFlow 4s linear infinite;
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.3);
            letter-spacing: 5px;
            position: relative;
        }
        .title::before {
            content: 'САЛЮТ ЕБЛАНЫ';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            background-size: inherit;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.7;
            animation: rgbFlow 4s linear infinite;
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .subtitle {
            margin-top: 30px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .line {
            width: 200px;
            height: 2px;
            margin: 20px auto;
            background: linear-gradient(90deg, transparent, #ff0080, #00c8ff, transparent);
            animation: rgbFlow 4s linear infinite;
            background-size: 300% 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="line"></div>
        <h1 class="title">САЛЮТ ЕБЛАНЫ</h1>
        <div class="line"></div>
    </div>
</body>
</html>
